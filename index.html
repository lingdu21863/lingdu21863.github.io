<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零度的博客 · A股收盘总结</title>
<meta name="description" content="A股每日收盘总结，记录市场行情、板块轮动与资金流向。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    color: #1f2328;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .site-header {
    background: #24292f;
    padding: 40px 20px 32px;
    text-align: center;
  }
  .site-header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -.5px;
    color: #ffffff;
    margin-bottom: 8px;
  }
  .site-header h1::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 22px;
    background: #58a6ff;
    border-radius: 3px;
    vertical-align: -3px;
    margin-right: 12px;
  }
  .site-header .tagline {
    font-size: 14px;
    color: #8b949e;
    font-weight: 400;
  }

  /* Container */
  .container {
    max-width: 820px;
    margin: 28px auto 0;
    padding: 0 20px 60px;
    position: relative;
  }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #1f2328;
    padding-left: 12px;
    border-left: 3px solid #0969da;
    margin-bottom: 16px;
  }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    font-size: 14px;
    font-family: inherit;
    color: #1f2328;
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-wrap input:focus {
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
  }
  .search-wrap input::placeholder { color: #8c959f; }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #8c959f;
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .result-count {
    font-size: 12px;
    color: #656d76;
    margin-bottom: 14px;
    padding-left: 2px;
  }

  /* Article card */
  .post-card {
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 24px 26px;
    margin-bottom: 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .post-card:hover {
    border-color: #0969da;
    box-shadow: 0 1px 4px rgba(31,35,48,0.06);
  }
  .post-card .date-badge {
    display: inline-block;
    background: #ddf4ff;
    color: #0969da;
    border: 1px solid #54aeff66;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .post-card h2 {
    font-size: 20px;
    font-weight: 600;
    color: #1f2328;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .post-card:hover h2 {
    color: #0969da;
  }
  .post-card .excerpt {
    font-size: 14px;
    color: #656d76;
    line-height: 1.8;
    margin-bottom: 14px;
  }
  .post-card .read-more {
    display: inline-block;
    color: #0969da;
    font-weight: 500;
    font-size: 13px;
  }
  .post-card .read-more::after {
    content: " →";
    transition: margin 0.15s;
  }
  .post-card:hover .read-more::after {
    margin-left: 4px;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #656d76;
    font-size: 14px;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
  }

  /* Footer */
  .site-footer {
    text-align: center;
    padding: 28px 20px;
    font-size: 12px;
    color: #656d76;
    border-top: 1px solid #d0d7de;
    margin-top: 24px;
    line-height: 1.9;
  }
  .site-footer .disclaimer {
    color: #6e7781;
  }

  @media (max-width: 640px) {
    .site-header { padding: 32px 20px 24px; }
    .site-header h1 { font-size: 22px; }
    .post-card { padding: 18px 16px; }
    .post-card h2 { font-size: 17px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>零度的博客</h1>
  <p class="tagline">A股每日收盘总结 · 行情复盘与板块追踪</p>
</header>

<div class="container">
  <h2 class="section-title">最新文章</h2>

  <div class="search-wrap">
    <span class="search-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04Z"/>
      </svg>
    </span>
    <input type="search" id="search-input" placeholder="搜索文章（日期 / 板块 / 个股）…" autocomplete="off">
  </div>

  <div id="result-count" class="result-count"></div>
  <div id="post-list">
    <noscript>
      <p class="empty">请启用 JavaScript 以查看和搜索文章列表。</p>
    </noscript>
  </div>
</div>

<footer class="site-footer">
  <p>&copy; 2026 零度的博客</p>
  <p class="disclaimer">本站内容仅供信息参考，不构成任何投资建议 · 投资有风险，决策需谨慎</p>
</footer>

<script>
(function () {
  var list = document.getElementById('post-list');
  var countEl = document.getElementById('result-count');
  var input = document.getElementById('search-input');
  var posts = [];

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render(items, total) {
    if (!items.length) {
      list.innerHTML = '<p class="empty">未找到匹配的文章，换个关键词试试吧。</p>';
      countEl.textContent = '共 ' + total + ' 篇 · 匹配 0 篇';
      return;
    }
    list.innerHTML = items.map(function (p) {
      return ''
        + '<a class="post-card" href="' + escapeHtml(p.url) + '">'
        +   '<span class="date-badge">' + escapeHtml(p.dateLabel) + '</span>'
        +   '<h2>' + escapeHtml(p.title) + '</h2>'
        +   '<p class="excerpt">' + escapeHtml(p.excerpt) + '</p>'
        +   '<span class="read-more">阅读全文</span>'
        + '</a>';
    }).join('');
    countEl.textContent = total === items.length
      ? '共 ' + total + ' 篇文章'
      : '共 ' + total + ' 篇 · 匹配 ' + items.length + ' 篇';
  }

  function filter() {
    var q = input.value.trim().toLowerCase();
    if (!q) { render(posts, posts.length); return; }
    var terms = q.split(/\s+/);
    var matched = posts.filter(function (p) {
      var hay = (p.title + ' ' + p.excerpt + ' ' + p.dateLabel + ' ' + (p.keywords || '')).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    });
    render(matched, posts.length);
  }

  input.addEventListener('input', filter);

  fetch('posts.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      posts = data.posts || [];
      render(posts, posts.length);
    })
    .catch(function () {
      list.innerHTML = '<p class="empty">文章索引加载失败，请稍后刷新重试。</p>';
    });
})();
</script>

</body>
</html>
